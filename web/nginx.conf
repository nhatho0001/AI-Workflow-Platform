server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Upload attachment tối đa 25MB (MAX_ATTACHMENT_SIZE ở backend)
    client_max_body_size 25m;

    # Resolve "server" qua DNS nội bộ của Docker lúc có request,
    # để nginx vẫn khởi động được khi container backend chưa sẵn sàng
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend http://server:8000;

    # API → FastAPI (cùng origin nên không cần CORS)
    location /api/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE chat streaming: không buffer, giữ kết nối lâu
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    location = /health {
        proxy_pass $backend;
    }

    # File build có hash trong tên → cache lâu dài
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: mọi route (/chat/..., /profile...) trả về index.html
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
