requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.140.13",
    "passlib>=1.7.4",
    "pydantic[email]>=2.13.4",
    "pydantic-settings>=2.15.0",
    "python-jose[cryptography]>=3.5.0",
